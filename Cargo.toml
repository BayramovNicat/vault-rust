[package]
name = "vault"
version = "0.1.0"
edition = "2024"
description = "High-performance, pure native Markdown viewer and personal knowledge base built with Rust and egui"
readme = "README.md"
license = "MIT"
authors = []
keywords = ["markdown", "notes", "knowledge-base", "egui", "obsidian"]
categories = ["text-editors", "gui"]

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow"] }
egui = { version = "0.33.3", default-features = false, features = ["default_fonts"] }
notify = { version = "8.2.1", default-features = false, features = ["macos_fsevent"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
egui_extras = { version = "0.33.3", features = ["all_loaders", "svg_text"] }
resvg = { version = "0.45.1", default-features = false, features = ["text", "system-fonts"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
latex-rust = "2.1.1"
emojis = "0.6"
window-vibrancy = "0.8.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSView", "NSResponder"] }
raw-window-handle = "0.6.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
