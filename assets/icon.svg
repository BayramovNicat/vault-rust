<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2E3D"/>
      <stop offset="1" stop-color="#0D0E13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#5B7CFA" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#7A4FE0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E95FF"/>
      <stop offset="1" stop-color="#A37BFF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- macOS icon grid: 824px rounded square centered in 1024 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>

  <!-- back sheet -->
  <rect x="330" y="250" width="420" height="530" rx="46" fill="#FFFFFF" fill-opacity="0.05"
        stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3" transform="rotate(8 540 515)"/>

  <!-- front glass sheet -->
  <g transform="rotate(-4 500 520)">
    <rect x="280" y="262" width="440" height="540" rx="48" fill="#1A1C27" fill-opacity="0.9"/>
    <rect x="280" y="262" width="440" height="540" rx="48" fill="url(#sheet)" stroke="url(#edge)" stroke-width="4"/>
    <!-- heading -->
    <rect x="336" y="336" width="210" height="34" rx="17" fill="url(#accent)"/>
    <!-- text lines -->
    <rect x="336" y="418" width="328" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.55"/>
    <rect x="336" y="466" width="290" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.40"/>
    <rect x="336" y="514" width="312" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.40"/>
    <!-- checklist -->
    <rect x="336" y="584" width="30" height="30" rx="9" fill="url(#accent)"/>
    <path d="M343 599 l7 7 l11 -13" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="386" y="589" width="220" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.30"/>
    <rect x="336" y="640" width="30" height="30" rx="9" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="4"/>
    <rect x="386" y="645" width="180" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.30"/>
    <!-- code chip -->
    <rect x="336" y="702" width="150" height="38" rx="10" fill="#FFFFFF" fill-opacity="0.10"/>
    <rect x="352" y="716" width="118" height="10" rx="5" fill="#8FB0FF" fill-opacity="0.75"/>
  </g>
</svg>
